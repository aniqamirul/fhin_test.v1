<!DOCTYPE html>
<html>

<head>

<title>FHIN Auto Spa</title>

<style>

body{
    background:#0f3d2e;
    font-family:Arial;
    margin:0;
    padding:20px;
    color:white;
}

.header{
    background:#14532d;
    padding:20px;
    border-radius:10px;
}

h1{
    color:#f97316;
}

.container{
    display:flex;
    gap:20px;
    margin-top:20px;
}

.card{
    background:#1b4332;
    padding:20px;
    border-radius:10px;
    flex:1;
    box-shadow:0 0 10px rgba(0,0,0,0.3);
}

input,
select{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:none;
    border-radius:5px;
}

button{
    background:#f97316;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#ea580c;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#f97316;
    padding:10px;
}

td{
    background:#2d6a4f;
    padding:10px;
}

</style>

</head>

<body>

<div class="header">

<h1>🚗 FHIN AUTO SPA</h1>

<p>Customer Management System</p>

</div>

<div class="container">

<div class="card">

<h2>New Visit</h2>

<input placeholder="Plate Number">

<select>
<option>M</option>
<option>L</option>
<option>XL</option>
</select>

<input placeholder="Amount">

<button>
Submit Visit
</button>

</div>

<div class="card">

<h2>Customer Search</h2>

<input placeholder="Search Plate">

<button>
Search
</button>

</div>

</div>

<br>

<div class="card">

<h2>Visit Records</h2>

<table>

<tr>
<th>Date</th>
<th>Plate</th>
<th>Amount</th>
</tr>

<tr>
<td>01/10/2026</td>
<td>VPF 71</td>
<td>RM25</td>
</tr>

</table>

</div>

</body>
</html>
