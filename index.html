<!DOCTYPE html>
<html>
<head>
    <title>FHIN Auto Spa</title>

    <style>

        body{
            font-family: Arial;
            background-color: #f4f4f4;
            margin:0;
            padding:20px;
        }

        h1{
            color:#1f2937;
        }

        .container{
            display:flex;
            gap:20px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
            flex:1;
        }

        input, select{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
        }

        button{
            background:#2563eb;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:5px;
            cursor:pointer;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        table, th, td{
            border:1px solid #ddd;
        }

        th, td{
            padding:10px;
        }

        th{
            background:#2563eb;
            color:white;
        }

    </style>
</head>

<p>Azraqs, Terrans and Sonions were here 🚀</p>

<body>

<h1>🚗 FHIN Auto Spa System</h1>

<div class="container">

    <div class="card">

        <h2>New Visit Entry</h2>

        <label>Plate Number</label>
        <input type="text" placeholder="ABC1234">

        <label>Vehicle Size</label>
        <select>
            <option>M</option>
            <option>L</option>
            <option>XL</option>
        </select>

        <label>Service</label>
        <select>
            <option>Normal Wash</option>
            <option>Premium Spa</option>
            <option>Exclusive Spa</option>
            <option>Diamond Polish</option>
        </select>

        <label>Amount</label>
        <input type="number">

        <button>
            Submit Visit
        </button>

    </div>

    <div class="card">

        <h2>Search Customer</h2>

        <input type="text"
        placeholder="Search Plate Number">

        <button>
            Search
        </button>

        <br><br>

        <h3>Customer Result</h3>

        <p>
            Plate: VPF 71
        </p>

        <p>
            Visits: 6
        </p>

        <p>
            Total Spend: RM195
        </p>

    </div>

</div>

<br>

<div class="card">

    <h2>Visit Records</h2>

    <table>

        <tr>
            <th>Date</th>
            <th>Plate</th>
            <th>Amount</th>
        </tr>

        <tr>
            <td>01/10/2026</td>
            <td>VPF 71</td>
            <td>RM25</td>
        </tr>

        <tr>
            <td>01/10/2026</td>
            <td>APF 71</td>
            <td>RM35</td>
        </tr>

    </table>

</div>

</body>
</html>
